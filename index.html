<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>একটা কথা ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff4b7d, #ff9a9e);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            position: relative;
            z-index: 10;
        }

        .heart {
            font-size: 65px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
        }

        h1 {
            color: #ff2f68;
            margin: 10px 0;
        }

        p {
            color: #444;
            font-size: 18px;
            line-height: 1.7;
        }

        .name {
            color: #ff2f68;
            font-weight: bold;
        }

        button {
            border: none;
            padding: 13px 28px;
            margin: 8px;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        .yes {
            background: #ff2f68;
            color: white;
        }

        .yes:hover {
            transform: scale(1.1);
        }

        .no {
            background: #eeeeee;
            color: #333;
        }

        #message {
            margin-top: 20px;
            color: #ff2f68;
            font-size: 21px;
            font-weight: bold;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <!-- RINI  -->
        <h1>Hey, <span class="RINI ">RINI </span>! 💕</h1>

        <p>
            তোমাকে আমি অনেক লাইক করি। 😊<br>
            অনেকদিন ধরে একটা কথা বলতে চাচ্ছিলাম...
        </p>

        <h2>তুমি কি আমার সারাজীবনের পথ চলার সঙ্গী হবে? ❤️</h2>

        <button class="yes" onclick="yesAnswer()">
            হ্যাঁ ❤️
        </button>

        <button class="no" onclick="noAnswer()">
            না দিওনা প্লিজ 🥺
        </button>

        <div id="message"></div>

    </div>

    <script>

        function yesAnswer() {
            document.getElementById("message").innerHTML =
                "Thank You! 🥰❤️ Thank You So Much 😊!";
        }

        function noAnswer() {
            document.getElementById("message").innerHTML =
                "ঠিক আছে 😊 তোমার সিদ্ধান্তকে আমি সম্মান করি।";
        }

        // Floating hearts
        function createHeart() {

            const heart = document.createElement("div");

            heart.classList.add("floating-heart");

            heart.innerHTML = "❤️";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (Math.random() * 3 + 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 500);

    </script>

</body>
</html
